name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: macOS / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate scripts and translations
        run: |
          bash -n scripts/build.sh scripts/package.sh scripts/toolchain.sh scripts/make-icon.sh
          plutil -lint assets/Info.plist assets/en.lproj/Localizable.strings assets/zh-Hans.lproj/Localizable.strings assets/en.lproj/InfoPlist.strings assets/zh-Hans.lproj/InfoPlist.strings
      - name: Test, compile, and verify local signature
        env:
          ARCH: ${{ matrix.arch }}
        run: bash scripts/build.sh
      - name: Verify executable architecture
        run: lipo -verify_arch ${{ matrix.arch }} build/DriftShelf.app/Contents/MacOS/DriftShelf
